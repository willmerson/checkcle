version: '3.8'

services:
  # Checkcle application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkcle
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - checkcle_data:/app/pb_data
    environment:
      - CHECKCLE_ENV=production
    depends_on:
      - db
    networks:
      - checkcle_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  # increased from 20s - app takes longer to start on my machine

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: checkcle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - checkcle_network
    profiles:
      - with-nginx

  # Optional: Database (if using external DB instead of embedded SQLite)
  db:
    image: postgres:15-alpine
    container_name: checkcle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-checkcle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-checkcle_secret}
      POSTGRES_DB: ${DB_NAME:-checkcle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - checkcle_network
    profiles:
      - with-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-checkcle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s  # give postgres time to initialize before retrying

volumes:
  checkcle_data:
    driver: local
  postgres_data:
    driver: local

networks:
  checkcle_network:
    driver: bridge
